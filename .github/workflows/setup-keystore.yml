name: Setup Keystore (run once)

# Run this ONCE to generate the signing keystore.
# After running: download the artifact "keystore-setup", open secrets.txt,
# and add the 4 values as repository secrets (Settings → Secrets → Actions).
# Then all build.yml runs will sign APKs with this keystore.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore + secrets file
        run: |
          # Random 20-char password
          KS_PASS=$(openssl rand -base64 15 | tr -dc 'A-Za-z0-9' | head -c 20)
          KS_ALIAS="vula"

          keytool -genkey -v \
            -keystore keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "${KS_ALIAS}" \
            -storepass "${KS_PASS}" -keypass "${KS_PASS}" \
            -dname "CN=VulaApp, OU=Apps, O=CodeApes, L=Harare, S=Harare, C=ZW" \
            -noprompt

          KS_B64=$(base64 -w 0 keystore.jks)

          # Write all 4 secret values to a file (never printed to log)
          cat > secrets.txt <<EOF
          KEYSTORE_BASE64=${KS_B64}
          KEYSTORE_PASS=${KS_PASS}
          KEYSTORE_ALIAS=${KS_ALIAS}
          KEY_PASS=${KS_PASS}
          EOF

          echo "Keystore generated. Download the artifact, open secrets.txt," >> $GITHUB_STEP_SUMMARY
          echo "and add all 4 lines as repository secrets." >> $GITHUB_STEP_SUMMARY

      - name: Upload keystore setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-setup
          path: |
            keystore.jks
            secrets.txt
          retention-days: 1
